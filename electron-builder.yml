appId: com.fileswitcher.app
productName: FileSwitcher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!test'
  - '!scripts'
extraResources:
  - from: resources/addon.py
    to: addon.py
mac:
  target: dmg
  category: public.app-category.developer-tools
  identity: null
  extraResources:
    - from: resources/bin/mac
      to: bin/mac
win:
  target: nsis
  # собрать mitmdump.exe на Windows (PyInstaller не кросс-компилирует) и положить в resources/bin/win/
  extraResources:
    - from: resources/bin/win
      to: bin/win
linux:
  target: AppImage
  category: Development
  extraResources:
    - from: resources/bin/linux
      to: bin/linux
