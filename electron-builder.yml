appId: com.fileswitcher.app
productName: FileSwitcher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.prettierignore,.prettierrc.json,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!test'
  - '!scripts'
extraResources:
  - from: resources
    to: .
    filter:
      - trayTemplate*.png
mac:
  target: dmg
  category: public.app-category.developer-tools
  identity: null
  extendInfo:
    LSUIElement: true
