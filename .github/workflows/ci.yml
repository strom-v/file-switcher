name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - run: swift build

      - run: swift test

      - run: ./package-app.sh
        env:
          CODE_SIGN_IDENTITY: '-'

      - run: ./dist/FileSwitcher.app/Contents/MacOS/FileSwitcher --selftest
