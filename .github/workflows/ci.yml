name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm test

      - run: npm run build

  addon-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest resources/ -q

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - run: swift build

      - run: swift test

      - run: ./package-app.sh
        env:
          CODE_SIGN_IDENTITY: '-'

      - run: ./build/FileSwitcher.app/Contents/MacOS/FileSwitcher --selftest
